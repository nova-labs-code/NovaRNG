<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova RNG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Mute Button -->
<button id="mute-btn" class="top-btn">🔊</button>

<div class="container">

  <!-- Page 1: Roll -->
  <div class="page" id="page1">
    <h1>Nova RNG</h1>
    <div id="login-streak">Login Streak: 0</div>

    <div id="roll-buttons">
      <button id="pick-btn" class="roll-btn">🎲 Roll</button>
      <button id="auto-roll-btn" class="roll-btn">🎲 Auto Roll</button>
      <button id="fast-auto-roll-btn" class="roll-btn">🎲 Fast Auto Roll</button>
    </div>

    <div id="result"><div class="result-text">🎉 Ready to roll!</div></div>
    <div id="roll-history"></div>
  </div>

  <!-- Page 2: Odds -->
  <div class="page" id="page2">
    <h2>Rarity Odds</h2>
    <div id="odds-panel"></div>
  </div>

  <!-- Page 3: Upgrades -->
  <div class="page" id="page3">
    <h2>Upgrades</h2>
    <div id="upgrades-panel"></div>
  </div>

  <!-- Page 4: Stats -->
  <div class="page" id="page4">
    <h2>Your Stats</h2>
    <div id="stats-panel"></div>
    <button id="reset-stats" class="roll-btn">Reset Stats</button>
  </div>

  <!-- Page 5: Rebirth & Prestige -->
  <div class="page" id="page5">
    <h2>Rebirth & Prestige</h2>
    <div class="stats-box"><span>Rebirths</span><span id="rebirth-count">0</span></div>
    <div class="stats-box"><span>Prestiges</span><span id="prestige-count">0</span></div>
    <div class="stats-box"><span>Point Multiplier</span><span id="multiplier-display">1.00×</span></div>
    <button id="rebirth-btn" class="roll-btn">🔁 Rebirth</button>
    <button id="prestige-btn" class="roll-btn">⭐ Prestige</button>
  </div>

  <!-- Page 6: Settings -->
  <div class="page" id="page6">
    <h2>Settings</h2>
    <div class="stats-box">Lockscreen: <span id="lockscreen-status">Off</span></div>
    <div class="stats-box">Offline Upgrade: <span id="offline-status">Locked</span></div>
    <div class="stats-box">Sound: <span id="sound-status">On</span></div>
    <div class="stats-box">Other settings can go here...</div>
  </div>

</div>

<!-- Popup -->
<div id="popup"></div>

<script src="script.js"></script>
</body>
</html>
