<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova RNG</title>
<link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
<style>
  /* Position mute button top-left */
  #mute-btn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 999;
    font-size: 24px;
    padding: 5px 10px;
    border-radius: 8px;
    border: none;
    background: #222;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body data-theme="dark">

<!-- Mute button -->
<button id="mute-btn">🔊</button>

<div class="container">

  <!-- Page 1: Roll -->
  <div class="page" id="page1">
    <h1>Nova RNG</h1>
    <div id="login-streak">Login Streak: 0</div>

    <div id="roll-buttons">
      <div class="roll-btn-container">
        <button id="pick-btn" class="roll-btn">🎲 Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="auto-roll-btn" class="roll-btn">🎲 Auto Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="fast-auto-roll-btn" class="roll-btn">🎲 Fast Auto Roll</button>
      </div>
    </div>

    <div id="result">
      <div class="result-text">🎉 Ready to roll!</div>
    </div>

    <div id="roll-history"></div>
  </div>

  <!-- Page 2: Odds -->
  <div class="page" id="page2">
    <h2>Rarity Odds</h2>
    <div id="odds-panel"></div>
  </div>

  <!-- Page 3: Upgrades -->
  <div class="page" id="page3">
    <h2>Upgrades</h2>
    <div id="upgrades-panel"></div>
  </div>

  <!-- Page 4: Stats -->
  <div class="page" id="page4">
    <h2>Your Stats</h2>
    <div id="stats-panel"></div>
    <button id="reset-stats" class="roll-btn">Reset Stats</button>
  </div>

  <!-- Popup -->
  <div id="popup"></div>

</div>

<script src="script.js"></script>
</body>
</html>
