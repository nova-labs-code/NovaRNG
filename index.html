<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova RNG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="pages">

    <!-- Page 1: Main RNG -->
    <div class="page" id="page1">
      <h1>Nova RNG</h1>
      <div id="probabilities" class="prob-panel"></div>
      <button id="pick-btn">🎲 Roll</button>
      <div id="result"></div>
      <p class="swipe-hint">Swipe left → for more</p>
    </div>

    <!-- Page 2: Extra Content / History / Info -->
    <div class="page" id="page2">
      <h2>Extras</h2>
      <p>Here you can put a history log, fun info, or additional odds visualization!</p>
      <button id="back-btn">← Back</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
