<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova RNG</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<div class="container">

  <!-- Page 1: Roll -->
  <div class="page" id="page1">
    <h1>Nova RNG</h1>
    <div id="login-streak">Login Streak: 0</div>

    <div id="roll-buttons">
      <div class="roll-btn-container">
        <button id="pick-btn" class="roll-btn">🎲 Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="auto-roll-btn" class="roll-btn">🎲 Auto Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="fast-auto-roll-btn" class="roll-btn">🎲 Fast Auto Roll</button>
      </div>
    </div>

    <div id="result">
      <div class="result-text">🎉 Ready to roll!</div>
    </div>

    <div id="roll-history"></div>
  </div>

  <!-- Page 2: Odds -->
  <div class="page" id="page2">
    <h2>Rarity Odds</h2>
    <div id="odds-panel"></div>
  </div>

  <!-- Page 3: Upgrades -->
  <div class="page" id="page3">
    <h2>Upgrades</h2>
    <div id="upgrades-panel"></div>
  </div>

  <!-- Page 4: Stats -->
  <div class="page" id="page4">
    <h2>Your Stats</h2>
    <div id="stats-panel"></div>
    <button id="reset-stats" class="roll-btn">Reset Stats</button>
  </div>

  <!-- Page 5: Settings -->
  <div class="page" id="page5">
    <h2>Settings</h2>
    <div class="settings-panel">
      <label for="theme-select">Theme:</label>
      <select id="theme-select">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="blue">Blue</option>
      </select>

      <label for="volume-input">Volume (0-100):</label>
      <input type="number" id="volume-input" min="0" max="100" value="25">

      <label for="mute-checkbox">
        <input type="checkbox" id="mute-checkbox"> Mute
      </label>
    </div>
  </div>

  <!-- Popup -->
  <div id="popup"></div>

</div>

<script src="script.js"></script>
</body>
</html>
