<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nova RNG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Mute Button -->
<button id="mute-btn" style="
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 1000;
  padding: 10px;
  font-size: 16px;
  cursor: pointer;
">🔊</button>

<div class="container">

  <!-- Page 1: Roll -->
  <div class="page" id="page1">
    <h1>Nova RNG</h1>
    <div id="login-streak">Login Streak: 0</div>

    <div id="roll-buttons">
      <div class="roll-btn-container">
        <button id="pick-btn" class="roll-btn">🎲 Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="auto-roll-btn" class="roll-btn">🎲 Auto Roll</button>
      </div>
      <div class="roll-btn-container">
        <button id="fast-auto-roll-btn" class="roll-btn">🎲 Fast Auto Roll</button>
      </div>
    </div>

    <div id="result">
      <div class="result-text">🎉 Ready to roll!</div>
    </div>

    <div id="roll-history"></div>
  </div>

  <!-- Page 2: Odds -->
  <div class="page" id="page2">
    <h2>Rarity Odds</h2>
    <div id="odds-panel"></div>
  </div>

  <!-- Page 3: Upgrades -->
  <div class="page" id="page3">
    <h2>Upgrades</h2>
    <div id="upgrades-panel"></div>
  </div>

  <!-- Page 4: Stats -->
  <div class="page" id="page4">
    <h2>Your Stats</h2>
    <div id="stats-panel"></div>
    <button id="reset-stats" class="roll-btn">Reset Stats</button>
  </div>

  <!-- Page 5: Rebirth & Prestige -->
  <div class="page" id="page5">
    <h2>Rebirth & Prestige</h2>

    <div class="stats-box">
      <span>Rebirths</span>
      <span id="rebirth-count">0</span>
    </div>

    <div class="stats-box">
      <span>Prestige</span>
      <span id="prestige-count">0</span>
    </div>

    <div class="stats-box">
      <span>Point Multiplier</span>
      <span id="multiplier-display">1.00×</span>
    </div>

    <button id="rebirth-btn" class="roll-btn">🔁 Rebirth (500,000 points)</button>
    <button id="prestige-btn" class="roll-btn">⭐ Prestige (1000 rebirths)</button>
  </div>

  <!-- Page 6: Settings -->
  <div class="page" id="page6">
    <h2>Settings</h2>

    <div class="settings-item">
      <label for="volume-slider">Volume: <span id="volume-label">25%</span></label>
      <input type="range" min="0" max="100" value="25" id="volume-slider">
    </div>

    <div class="settings-item">
      <label for="mute-toggle">Mute</label>
      <input type="checkbox" id="mute-toggle">
    </div>

    <div class="settings-item">
      <label for="theme-select">Theme</label>
      <select id="theme-select">
        <option value="default">Default</option>
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </div>

    <div class="settings-item">
      <button id="reset-game-btn" class="roll-btn">Reset All Progress</button>
    </div>
  </div>

  <!-- Popup -->
  <div id="popup"></div>

</div>

<script src="script.js"></script>
</body>
</html>
